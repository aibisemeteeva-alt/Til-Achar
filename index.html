<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тил Ачар — Little Star Kyrgyz Reading Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Exact Specification Palette */
      --main-bg: #F2F6FA;
      --sidebar-bg: #1E3046;
      --sidebar-secondary: #263D55;
      --main-navy: #243449;
      --featured-banner: #285574;
      --active-nav: #C5E5EF;
      --active-nav-text: #1E3046;
      --pale-blue: #D9EDF4;
      --icon-bg: #E6F2F6;
      --cards-bg: #FFFFFF;
      --border-color: #DCE7EF;
      --primary-text: #26374D;
      --secondary-text: #8195A8;
      
      --accent-gold: #D97706;
      --accent-green: #059669;
      --accent-green-light: #ECFDF5;
      --accent-red: #DC2626;
      --accent-red-light: #FEF2F2;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;

      --shadow-subtle: 0 1px 3px rgba(30, 48, 70, 0.05);
      --shadow-card: 0 4px 12px rgba(30, 48, 70, 0.04), 0 1px 2px rgba(30, 48, 70, 0.02);
      --shadow-hover: 0 8px 24px rgba(30, 48, 70, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--main-bg);
      color: var(--primary-text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .platform-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Fixed Desktop Sidebar */
    .sidebar {
      width: 235px;
      background: var(--sidebar-bg);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 100;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    .sidebar-header {
      padding: 24px 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand-symbol {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6, #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.18rem;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.15;
    }
    .brand-subtitle {
      font-size: 0.7rem;
      color: #8da2b5;
      letter-spacing: 0.03em;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .nav-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #627b94;
      padding: 12px 10px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      color: #A9BCCF;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .nav-item:hover {
      background: var(--sidebar-secondary);
      color: #FFFFFF;
    }
    .nav-item.active {
      background: var(--active-nav);
      color: var(--active-nav-text);
      font-weight: 700;
    }
    .nav-item .icon {
      font-size: 1.05rem;
      width: 20px;
      display: inline-flex;
      justify-content: center;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.1);
    }
    .user-badge-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .user-avatar-mini {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--featured-banner);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .user-info-mini {
      overflow: hidden;
      flex: 1;
    }
    .user-info-mini .name {
      font-size: 0.84rem;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-info-mini .sub {
      font-size: 0.7rem;
      color: #8da2b5;
    }

    /* Main Work Area */
    .main-viewport {
      flex: 1;
      padding: 32px 44px;
      max-width: 1220px;
      overflow-y: auto;
    }

    /* Typography */
    h1, h2, h3, h4 { color: var(--primary-text); }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }
    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      margin: 26px 0 14px;
    }
    h3 {
      font-size: 1.02rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    p { color: var(--primary-text); }
    .text-secondary { color: var(--secondary-text); }
    .text-sm { font-size: 0.85rem; }

    /* Cards */
    .card {
      background: var(--cards-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
    }
    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* Featured Banner */
    .featured-banner {
      background: var(--featured-banner);
      color: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 32px 36px;
      margin-bottom: 26px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(40, 85, 116, 0.25);
    }
    .featured-banner::after {
      content: "🪐 ✨ ⭐ 🦊";
      position: absolute;
      right: 28px;
      bottom: 16px;
      font-size: 3.2rem;
      opacity: 0.22;
      pointer-events: none;
    }
    .featured-banner h2 {
      color: #FFFFFF;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .featured-banner p {
      color: #E2EEF5;
      font-size: 0.98rem;
      max-width: 600px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Stats Triad */
    .stats-triad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 26px;
    }
    .stat-card-clean {
      background: var(--cards-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px 22px;
      box-shadow: var(--shadow-subtle);
    }
    .stat-card-clean .label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--secondary-text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-card-clean .value {
      font-size: 1.95rem;
      font-weight: 800;
      color: var(--main-navy);
      margin-top: 4px;
      line-height: 1.1;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-pale { background: var(--pale-blue); color: var(--main-navy); }
    .badge-green { background: var(--accent-green-light); color: var(--accent-green); }
    .badge-amber { background: #FEF3C7; color: #92400E; }
    .badge-gray  { background: #F3F4F6; color: #6B7280; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--main-navy);
      color: #FFFFFF;
      border: none;
      outline: none;
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .btn:hover {
      background: #192737;
      transform: translateY(-1px);
    }
    .btn-pale {
      background: var(--active-nav);
      color: var(--active-nav-text);
    }
    .btn-pale:hover {
      background: #b1dbeb;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--primary-text);
    }
    .btn-outline:hover {
      background: var(--main-bg);
      border-color: #B5CBD8;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    /* Forms */
    input, select, textarea {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--primary-text);
      background: #FFFFFF;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--main-navy);
      box-shadow: 0 0 0 3px rgba(36, 52, 73, 0.1);
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary-text);
      margin-bottom: 5px;
    }

    /* Tables */
    .table-responsive {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow-x: auto;
      box-shadow: var(--shadow-subtle);
    }
    .table-clean {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .table-clean th {
      background: #F8FAFD;
      padding: 12px 16px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--secondary-text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border-color);
    }
    .table-clean td {
      padding: 13px 16px;
      border-bottom: 1px solid #EEF3F7;
      font-size: 0.88rem;
      vertical-align: middle;
    }
    .table-clean tr:hover td { background: #F9FBFC; }

    /* Editorial Reader Layout */
    .reader-grid {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 26px;
      align-items: start;
    }
    .reader-sheet {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 44px 50px;
      box-shadow: var(--shadow-card);
    }
    .reader-sheet h1 {
      font-size: 2.1rem;
      color: var(--main-navy);
      margin-bottom: 24px;
    }
    .reader-sheet p {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.15rem;
      line-height: 1.95;
      color: #2D3E53;
      margin-bottom: 22px;
      text-indent: 1.5em;
    }
    .vocab-hl {
      background: #E8F4F8;
      color: #174E6F;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px dashed #285574;
    }
    .vocab-hl:hover { background: #CBE6F0; }

    .vocab-panel {
      position: sticky;
      top: 24px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px;
      box-shadow: var(--shadow-card);
    }
    .vocab-entry {
      padding: 12px 0;
      border-bottom: 1px solid #EEF3F7;
    }
    .vocab-entry:last-child { border-bottom: none; }
    .vocab-entry .word {
      font-weight: 700;
      color: var(--main-navy);
      font-size: 0.98rem;
    }
    .vocab-entry .trans {
      color: #0369A1;
      font-size: 0.88rem;
      font-weight: 600;
      margin: 2px 0;
    }
    .vocab-entry .desc {
      font-size: 0.82rem;
      color: var(--secondary-text);
      line-height: 1.4;
    }

    /* Chapter Cards */
    .chapter-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .chapter-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-subtle);
      transition: all 0.2s;
    }
    .chapter-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .chapter-card.locked {
      background: #F9FBFC;
      opacity: 0.8;
      border-style: dashed;
    }

    /* Messaging Chat Box */
    .chat-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      height: 580px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .chat-inbox {
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      background: #FAFBFD;
    }
    .conv-item {
      padding: 14px 16px;
      border-bottom: 1px solid #EEF3F7;
      cursor: pointer;
      transition: background 0.15s;
    }
    .conv-item:hover, .conv-item.active { background: #EEF5F8; }
    .conv-item .name { font-weight: 600; font-size: 0.88rem; color: var(--primary-text); }
    .conv-item .preview {
      font-size: 0.78rem;
      color: var(--secondary-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .chat-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #FFFFFF;
    }
    .chat-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px 14px 14px 2px;
      background: var(--icon-bg);
      color: var(--primary-text);
      font-size: 0.88rem;
      border: 1px solid var(--border-color);
      align-self: flex-start;
    }
    .chat-bubble.mine {
      align-self: flex-end;
      background: var(--main-navy);
      color: #FFFFFF;
      border-color: var(--main-navy);
      border-radius: 14px 14px 2px 14px;
    }
    .chat-bubble .meta {
      font-size: 0.68rem;
      opacity: 0.75;
      margin-top: 4px;
      text-align: right;
    }

    /* Modal System */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30, 48, 70, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
      backdrop-filter: blur(3px);
    }
    .modal-window {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
    }

    /* Auth Page */
    .auth-backdrop {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #263D55 0%, #1E3046 100%);
      padding: 24px;
    }
    .auth-box {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 38px 42px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.3);
    }
    .auth-box .logo-area { text-align: center; margin-bottom: 24px; }
    .auth-box .symbol { font-size: 2.8rem; margin-bottom: 8px; }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--main-navy);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100000;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 860px) {
      .platform-shell { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; }
      .main-viewport { padding: 20px 16px; }
      .stats-triad { grid-template-columns: 1fr; }
      .reader-grid { grid-template-columns: 1fr; }
      .chat-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="app"></div>
<div id="modal-space"></div>
<div id="toast"></div>

      title: "1-бөлүм: Учкучтун балалыгы жана сырдуу сүрөт",
      desc: "Боа жыланы, пил жана чоңдордун түшүнбөстүгү",
      text: [
        `Алты жашымда тунгуюк токойлор тууралуу укмуштуу бир китептен сүрөт көрдүм. Анда пилди бүтүндөй жутуп жаткан боа жыланы тартылган экен. Мен көп ойлонуп, карындаш менен өзүмдүн эң биринчи сүрөтүмдү тарттым. Бул менин №1 сүрөтүм эле.`,
        `Мен аны чоң кишилерге көрсөтүп: «Бул сүрөт силерди коркутуп жатабы?» — деп сурадым. Бирок чоңдор: «Эмнеге шляпадан коркушубуз керек?» деп таң калышты. Чындыгында ал шляпа эмес, пилди жутуп алган боа жыланы болчу.`,
        `Чоң кишилер эч нерсени өз алдынча түшүнүшпөйт. Аларга дайыма баарын кайра-кайра түшүндүрүп берүү балдар үчүн өтө тажатма иш эле.`

const addDays = (d, n) => {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dt.toISOString().slice(0, 10);
};

async function H(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function toast(msg) {

}

// True Duolingo-style streak calculation:
// ONLY awards a streak if consecutive days have completed chapter tests!
function getStudentStreak(login) {
  const p = DB.progress[login];
  if (!p || !p.activeDays || p.activeDays.length === 0) return 0;

  const sorted = [...new Set(p.activeDays)].sort().reverse();
  const cur = today();
  const yesterday = addDays(cur, -1);

  // In Duolingo: streak is alive if you completed today OR yesterday
  if (sorted[0] !== cur && sorted[0] !== yesterday) {
    return 0; // Streak broken if missed yesterday and haven't done today
  }

  let streak = 1;
  let checkDate = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    const expectedPrev = addDays(checkDate, -1);
    if (sorted[i] === expectedPrev) {
      streak++;
      checkDate = expectedPrev;
    } else {
      break;
    }
  }
  return streak;
}

// Real-time score calculation based strictly on saved completed activities
function getStudentStats(login) {
  const p = DB.progress[login] || { completedChapters: [], testScores: {}, grammarScores: {}, activeDays: [] };
  let testPts = 0;
  for (const tid in (p.testScores || {})) {
    testPts += (+p.testScores[tid].score || 0);
  }
  let grammarPts = 0;
  for (const gid in (p.grammarScores || {})) {
    grammarPts += (+p.grammarScores[gid].score || 0);
  }
  const readPts = (p.completedChapters || []).length * 15;
  const streakCount = getStudentStreak(login);
  const streakPts = streakCount * 10;
  const manualPts = (DB.manualPoints[login] || []).reduce((a, b) => a + (+b.pts || 0), 0);

  const total = testPts + grammarPts + readPts + streakPts + manualPts;
  return {
    total,
    testPts,
    grammarPts,
    readPts,
    streakPts,
    manualPts,
    completedChaptersCount: (p.completedChapters || []).length,
    streakCount
  };
}

// Robust calendar-based chapter unlocking check
function isChapterUnlocked(chIdx) {
  // Staff always has full preview access
  if (U() && U().r !== 's') return true;
  if (DB.unlockedAll) return true;

  // Calendar comparison: strictly unlocks when today() >= scheduled date
  const targetDate = DB.chapterDates?.[chIdx] || addDays(DB.startDate || today(), chIdx);
  return today() >= targetDate;
}

// Current marathon day determination
function getCurrentMarathonDay() {
  if (DB.unlockedAll) return 8;
  const cur = today();
  let day = 0;
  for (let i = 0; i < (DB.chapterDates || []).length; i++) {
    if (cur >= DB.chapterDates[i]) {
      day = i + 1;
    }
  }
  return Math.min(8, Math.max(1, day));
}

        </div>
      </div>

      <div class="chapter-cards-grid">

                ${isDone ? '<span class="badge badge-green">✔ Окулду</span>' : (isUnlocked ? '<span class="badge badge-amber">Ачык</span>' : `<span class="badge badge-gray">🔒 ${unlockDate} күнү ачылат</span>`)}
              </div>
              <h3 style="margin-top:6px">${ch.num}-бөлүм</h3>

                <span class="text-sm text-secondary">${(ch.vocab || []).length} сөз • Тест</span>

  // Reader Experience
  student_reading() {
    const chIdx = ARG !== null && ARG !== undefined ? +ARG : 0;
    const ch = DB.chapters[chIdx];
    if (!ch) return `<p>Бөлүм табылган жок</p>`;
    const isUnlocked = isChapterUnlocked(chIdx);
    const p = P();
    const isDone = (p.completedChapters || []).includes(chIdx);
    const unlockDate = DB.chapterDates?.[chIdx] || addDays(DB.startDate, chIdx);

    if (!isUnlocked) {
      return `
        <button class="btn btn-sm btn-outline" onclick="go('student_book')">← Китепке кайтуу</button>
        <div class="card" style="text-align:center;padding:50px;margin-top:20px">
          <div style="font-size:3rem">🔒</div>
          <h2>Бул бөлүм ${unlockDate} күнү ачылат</h2>
          <p class="text-secondary">Календардык график боюнча ар бир бөлүм өз күнүндө автоматтык түрдө ачылат.</p>
        </div>
      `;
    }

    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <button class="btn btn-sm btn-outline" onclick="go('student_book')">← Китепке кайтуу</button>
        <span class="badge badge-pale">Марафон: ${ch.day}-күн</span>
      </div>

      <div class="reader-grid">
        <div class="reader-sheet">
          <div style="border-bottom:1px solid #EEF3F7;padding-bottom:14px;margin-bottom:24px">
            <span style="font-size:0.8rem;font-weight:700;color:#285574;text-transform:uppercase;letter-spacing:0.06em">Кичинекей ханзаада • ${ch.num}-бөлүм</span>
            <h1>${esc(ch.title)}</h1>
          </div>

          <div>
            ${ch.text.map((pText, pIdx) => {
              let html = esc(pText);
              (ch.vocab || []).forEach(v => {
                const reg = new RegExp(`(${v.word})`, 'gi');
                html = html.replace(reg, `<span class="vocab-hl" onclick="showWordDef('${v.word}','${esc(v.ru)}','${esc(v.desc)}')">${'$1'}</span>`);
              });
              const imgBlock = (pIdx === 0 && ch.imgs && ch.imgs.length)
                ? `<div style="display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 8px 0">${ch.imgs.map(src => `<img src="${src}" alt="" style="max-width:100%;height:auto;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.12)">`).join('')}</div>`
                : '';
              return `<p>${html}</p>${imgBlock}`;
            }).join('')}
          </div>

          <div style="margin-top:40px;padding-top:22px;border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center">
            <div>
              ${isDone 
                ? '<span class="badge badge-green">✔ Бул бөлүм окулган</span>'
                : '<span class="text-sm text-secondary">Бөлүмдү окуп бүткөн соң тестти тапшырып, упай жана огонёк 🔥 алыңыз:</span>'
              }
            </div>
            <button class="btn btn-pale" onclick="go('student_test', ${chIdx})">
              📝 Тестке өтүү ➔
            </button>
          </div>
        </div>

        <div class="vocab-panel">
          <h3 style="margin-bottom:14px;display:flex;align-items:center;gap:6px">
            <span>📖</span> Жаңы сөздөр (${(ch.vocab || []).length})
          </h3>
          <p class="text-sm text-secondary" style="margin-bottom:12px">Тексттеги белгиленген сөздөрдү басып, орусча маанисин көрүңүз.</p>
          <div>
            ${(ch.vocab || []).map(v => `
              <div class="vocab-entry">
                <div class="word">${esc(v.word)}</div>
                <div class="trans">${esc(v.ru)}</div>
                <div class="desc">${esc(v.desc)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  },

// Submitting chapter test: THIS is where Duolingo streak & active days are earned!
function submitChapterTest(chIdx) {
  const ch = DB.chapters[chIdx];
  const p = P();
  let score = 0;

  for (const q of (ch.questions || [])) {
    if (q.type === 'mc' || q.type === 'tf') {
      const selected = document.querySelector(`input[name="${q.id}"]:checked`);
      if (selected && +selected.value === q.ans) score += q.pts;
    } else {
      const val = $(`#${q.id}`)?.value.trim();
      if (val && val.length > 5) score += q.pts;
    }
  }

  p.testScores[chIdx] = { score, date: today() };
  if (!p.completedChapters.includes(chIdx)) p.completedChapters.push(chIdx);
  
  // Duolingo streak rule: active day ONLY added when chapter test is successfully completed!
  if (!p.activeDays.includes(today())) {
    p.activeDays.push(today());
  }

  saveDB();
  const streakNow = getStudentStreak(ME);
  toast(`Тест тапшырылды! +${score} балл. Огонёк: 🔥 ${streakNow} күн! ✔`);
  go('student_home');
}

function submitGrammar(topicId) {
  const g = DB.grammarTopics.find(t => t.id === topicId);
  const p = P();
  let score = 0;

  (g.exercises || []).forEach((ex, idx) => {
    const sel = document.querySelector(`input[name="${g.id}_${idx}"]:checked`);
    if (sel && +sel.value === ex.ans) score += ex.pts;
  });

  p.grammarScores[topicId] = { score, date: today() };
  saveDB();
  toast(`Грамматика сакталды! +${score} балл кошулду ✔`);
  go('student_home');
}

function awardBonus(login) {
  const n = $('#bonusName').value.trim();
  const s = $('#bonusPts').value.trim();
  if (!n || !s) return toast('Талааларды толтуруңуз');
  (DB.manualPoints[login] ??= []).push({ name: n, pts: +s || 0 });
  saveDB();
  renderApp();
  toast('Бонус балл кошулду ✔');
}

function sendChatMessage() {
  const inp = $('#chatInput');
  const txt = inp?.value.trim();
  if (!txt) return;
  DB.messages.push({
    thread: CHAT_WITH,
    sender: ME,
    text: txt,
    ts: Date.now()
  });
  saveDB();
  inp.value = '';
  renderApp();
  const box = $('#chatBox');
  if (box) box.scrollTop = box.scrollHeight;
}

// Updating calendar start date
function updateMarathonStartDate() {
  const newDate = $('#mStartDateInput').value;
  if (!newDate) return;
  DB.startDate = newDate;
  DB.chapterDates = Array.from({ length: 8 }, (_, i) => addDays(newDate, i));
  DB.unlockedAll = false;
  saveDB();
  toast(`Марафондун башталышы ${newDate} деп коюлду. График жаңырды ✔`);
  renderApp();
}

function updateSingleChapterDate(chIdx, newDate) {
  if (!newDate) return;
  DB.chapterDates[chIdx] = newDate;
  saveDB();
  toast(`${chIdx + 1}-бөлүмдүн күнү ${newDate} деп коюлду ✔`);
  renderApp();
}

function unlockAllMarathon() {
  DB.unlockedAll = true;
  saveDB();
  toast('Бардык бөлүмдөр ачылды (Unlock All) ✔');
  renderApp();
}

// Reset all student scores cleanly to zero
function resetAllStudentScores() {
  if (confirm('Чын эле бардык 23 окуучунун упайларын жана жыйынтыктарын толугу менен нөлдөөнү (обнулить) каалайсызбы?')) {
    DB.progress = {};
    DB.manualPoints = {};
    saveDB();
    toast('Бардык окуучулардын упайлары нөлдөндү! (0 балл) ✔');
    renderApp();
  }
}

function changeStudentGroup(login, groupId) {
  if (DB.users[login]) {
    DB.users[login].g = +groupId;
    saveDB();
    toast('Окуучунун тобу өзгөртүлдү ✔');
    renderApp();
  }
}

function resetStudentPassword(login) {
  const newPass = prompt(`@${login} үчүн жаңы сырсөздү жазыңыз:`, 'Pass_2026!');
  if (newPass) {
    H(newPass).then(h => {
      DB.users[login].h = h;
      DB.users[login].plainPass = newPass;
      saveDB();
      toast('Сырсөз ийгиликтүү алмаштырылды ✔');
    });
  }
}

function exportLoginSheet() {
  const students = Object.keys(DB.users).filter(l => DB.users[l].r === 's');
  let text = 'ТИЛ АЧАР — ОКУУЧУЛАРДЫН КИРҮҮ БАРАКЧАСЫ (23 ОКУУЧУ, 6 ТОП)\n';
  text += '==========================================================\n\n';
  students.forEach((l, idx) => {
    const u = DB.users[l];
    text += `${idx + 1}. ${u.n}\n   Тобу: ${DB.groups[u.g]?.name} (${DB.groups[u.g]?.title})\n   Логин: ${l}\n   Сырсөз: ${u.plainPass}\n   Дарек: http://localhost:3000\n\n`;
  });
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `til_achar_students_logins_${today()}.txt`;
  a.click();
  toast('Баракча жүктөлдү ✔');
}

function exportDataCSV() {
  const students = Object.keys(DB.users).filter(l => DB.users[l].r === 's');
  let csv = 'Логин,Аты-жөнү,Тобу,ОкулганБөлүм,ТестБалл,StreakКүн,ЖалпыУпай\n';
  students.forEach(l => {
    const u = DB.users[l];
    const st = getStudentStats(l);
    csv += `"${l}","${u.n}","${DB.groups[u.g]?.name}",${st.completedChaptersCount},${st.testPts},${st.streakCount},${st.total}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `til_achar_students_report_${today()}.csv`;
  a.click();
  toast('CSV отчет жүктөлдү ✔');
}

function saveChaptersCMS() {
  try {
    const parsed = JSON.parse($('#chaptersJson').value);
    if (!Array.isArray(parsed)) throw 0;
    DB.chapters = parsed;
    saveDB();
    toast('Бөлүмдөр сакталды ✔');
  } catch (e) {
    toast('JSON форматында ката бар!');
  }
}

function restoreDefaultCurriculum() {
  if (confirm('Баштапкы мазмунга кайтарууну каалайсызбы?')) {
    DB.chapters = seed8Chapters();
    saveDB();
    renderApp();
    toast('Баштапкы мазмун кайтарылды ✔');
  }
}

// Pure Authentication: NO auto-streak awarded on login!
async function login(customU, customP) {
  const u = (customU || $('#loginUser').value).trim().toLowerCase();
  const p = customP || $('#loginPass').value;
  const user = DB.users[u];
  if (user && user.h === await H(p)) {
    ME = u;
    sessionStorage.setItem('til_achar_user', u);
    // Student simply views dashboard. Streak is ONLY earned after completing a chapter!
    PAGE = user.r === 's' ? 'student_home' : 'staff_home';
    renderApp();
  } else {
    $('#loginErr').textContent = 'Логин же сырсөз туура эмес. Кайра текшериңиз.';
  }
}

function logout() {
  sessionStorage.removeItem('til_achar_user');
  ME = null;
  renderApp();
}
